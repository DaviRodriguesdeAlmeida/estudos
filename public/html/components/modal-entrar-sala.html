<dialog id="dialog-entrar-sala" class="modal">
  <form id="form-entrar-sala" class="conteudo-modal">
    <h2>Entrar na sala privada</h2>
    <p id="nome-sala-selecionada" class="texto-secundario"></p>

    <label for="senha-entrar-sala">Senha</label>
    <input id="senha-entrar-sala" name="senha" type="password" autocomplete="current-password" required />

    <p id="mensagem-entrar-sala" class="mensagem" role="alert"></p>
    <div class="acoes-modal">
      <button id="cancelar-entrar-sala" class="botao botao-secundario" type="button">Cancelar</button>
      <button class="botao botao-principal" type="submit">Entrar</button>
    </div>
  </form>
</dialog>

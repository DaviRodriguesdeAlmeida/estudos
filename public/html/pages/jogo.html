<div id="cabecalho"></div>

<section class="pagina-jogo limite-pagina">
  <div class="topo-jogo">
    <div>
      <p class="texto-secundario">Sala</p>
      <h1 id="nome-sala"></h1>
    </div>
    <button id="sair-da-sala" class="botao botao-perigo" type="button">Sair da sala</button>
  </div>

  <p id="mensagem-jogo" class="mensagem" role="status"></p>

  <div class="area-jogo">
    <article class="jogador" id="jogador-1">
      <div class="acoes-jogador">
        <button id="iniciar-partida" class="botao botao-principal" type="button" hidden>Iniciar</button>
        <button id="desistir-jogador-1" class="botao botao-perigo" type="button" hidden>Desistir</button>
      </div>
      <img class="foto-jogador" src="/assets/usuario-padrao.svg" alt="Jogador 1" />
      <h2 data-nome-jogador></h2>
      <p><strong data-vitorias>0</strong> vitórias</p>
    </article>

    <div id="tabuleiro" class="tabuleiro" aria-label="Tabuleiro do jogo da velha">
      <button class="casa" type="button" data-posicao="0" aria-label="Casa 1"></button>
      <button class="casa" type="button" data-posicao="1" aria-label="Casa 2"></button>
      <button class="casa" type="button" data-posicao="2" aria-label="Casa 3"></button>
      <button class="casa" type="button" data-posicao="3" aria-label="Casa 4"></button>
      <button class="casa" type="button" data-posicao="4" aria-label="Casa 5"></button>
      <button class="casa" type="button" data-posicao="5" aria-label="Casa 6"></button>
      <button class="casa" type="button" data-posicao="6" aria-label="Casa 7"></button>
      <button class="casa" type="button" data-posicao="7" aria-label="Casa 8"></button>
      <button class="casa" type="button" data-posicao="8" aria-label="Casa 9"></button>
    </div>

    <article class="jogador" id="jogador-2">
      <div class="acoes-jogador">
        <button id="aguardando-jogador" class="botao" type="button" disabled>Aguardando</button>
        <button id="desistir-jogador-2" class="botao botao-perigo" type="button" hidden>Desistir</button>
      </div>
      <img class="foto-jogador" src="/assets/usuario-padrao.svg" alt="Jogador 2" />
      <h2 data-nome-jogador></h2>
      <p><strong data-vitorias>0</strong> vitórias</p>
    </article>
  </div>
</section>

<div id="modal-sair"></div>
